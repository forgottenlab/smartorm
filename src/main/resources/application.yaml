spring:
  datasource:
    url: jdbc:mysql://localhost:3306/test # 表建议新建库存放
    username: root # 输入自己的数据库用户名
    password: root # 输入自己的数据库密码
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis配置
mybatis:
  # mapper.xml文件位置
  mapper-locations: classpath:mapper/*.xml
  # 实体类包名
  type-aliases-package: com.smartorm
  configuration:
    # 开启驼峰命名自动映射
    map-underscore-to-camel-case: true
    # 日志实现
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志配置
logging:
  level:
    com.smartorm: debug
    org.mybatis: debug